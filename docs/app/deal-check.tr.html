<!--
  DEAL CHECK RESULT PAGE (template)
  ---------------------------------
  For the AI assistant: you only change the JSON inside <script id="deal-data">.
  Do not touch the CSS or the renderer below it. Show the whole file as one
  artifact / canvas. It is self-contained: no external fonts, scripts or
  requests. Nothing is stored or sent anywhere.

  Fields
  - lang: "en" or "tr" sets the built-in labels. Any other language: keep "en"
    and translate the labels in "ui" (same keys as UI.en in the script).
  - locale: number format, e.g. "en-GB", "tr-TR", "de-DE", "nl-NL".
  - run_date, decide_by: "YYYY-MM-DD". budget: text or null.
  - items[]: one per product.
      name, country, reason (the user's own words), picked (optional, why this
      model was chosen for a category), verdict: BUY | WAIT | SKIP | SUSPICIOUS,
      verdict_reason (one sentence), hint (short, under the stamp),
      currency: ISO code (TRY, EUR, USD, GBP...).
      prices[]: the bars. kind: "today" | "low" | "abroad" | "alt" | "other".
        value: number or null (null = not found, drawn as an empty bar).
        prefix: "" | "≈" | "≥". label, date ("YYYY-MM-DD"), url (source link).
        The first "today" and the first "low" give the % gap badge.
      checks: need, price, same, alt, timing (1-2 sentences each).
      sources[]: { label, url } every link you used for this item.
      history[]: one entry per check in this chat, oldest first:
        { date: "YYYY-MM-DD", value: number or null, url }. value is that
        day's "today" price. First run: one entry. Each re-check in the same
        chat: copy every earlier entry unchanged and add today's at the end.
        Never drop, edit or invent an entry. One entry per date (a second
        check on the same day replaces that day's entry).
  - total: one or two sentences. before_you_pay[]: at most 3 strings.
  - Every price needs a url. No url: set value to null and say "not found".
-->

<style>
:root{
  --paper:#EEF1F5; --surface:#FFFFFF; --ink:#121826; --muted:#566074; --line:#D3D9E2;
  --tag:#FFDD3C; --tag-ink:#121826; --abroad:#3A6FD8; --alt:#7B57C9; --other:#8C96A8;
  --buy:#1D7F47; --wait:#A86A12; --skip:#4F5B6E; --sus:#BF3226;
  --display:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E121A; --surface:#171D28; --ink:#E7EBF2; --muted:#9AA4B6; --line:#2A3242;
  --abroad:#6F9BFF; --alt:#A88BF0; --other:#6D7789;
  --buy:#4CC27F; --wait:#E3A23B; --skip:#93A0B5; --sus:#F06A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E121A; --surface:#171D28; --ink:#E7EBF2; --muted:#9AA4B6; --line:#2A3242;
  --abroad:#6F9BFF; --alt:#A88BF0; --other:#6D7789;
  --buy:#4CC27F; --wait:#E3A23B; --skip:#93A0B5; --sus:#F06A5C; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.01em;line-height:1.08;margin:0}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.brand{display:flex;align-items:center;gap:10px}
.brand i{width:24px;height:17px;background:var(--tag);display:inline-block;position:relative;clip-path:polygon(28% 0,100% 0,100% 100%,28% 100%,0 50%)}
.brand i::after{content:"";position:absolute;left:30%;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--tag-ink)}
h1{font-size:clamp(30px,6vw,44px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 12.5px/1.4 var(--mono);color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.private{margin-top:10px;font-size:13px;color:var(--muted)}

/* summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:22px}
.sum{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;min-width:0}
.sum:hover{border-color:var(--ink)}
.sum .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum .ct{font:500 12px/1.3 var(--mono);color:var(--muted)}

.pill{display:inline-block;flex:none;font:800 13px/1 var(--display);letter-spacing:.08em;padding:6px 9px 5px;border-radius:5px;border:2px solid currentColor;transform:rotate(-3deg);white-space:nowrap}
.v-BUY{color:var(--buy)}.v-WAIT{color:var(--wait)}.v-SKIP{color:var(--skip)}.v-SUSPICIOUS{color:var(--sus)}

/* item card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:22px;overflow:hidden}
.card-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;padding:20px 20px 16px}
.card-head h2{font-size:clamp(22px,4vw,28px);margin-top:6px}
.reason{font:400 13px/1.45 var(--mono);color:var(--muted);margin-top:6px}
.picked{font-size:13px;color:var(--muted);margin-top:4px}
.stamp{text-align:center}
.stamp .pill{font-size:19px;padding:9px 13px 8px;border-width:3px;background:var(--surface)}
.stamp small{display:block;max-width:150px;margin-top:8px;font:500 11px/1.35 var(--mono);color:var(--muted)}
.verdict-line{padding:0 20px 18px;font-weight:600;font-size:15.5px}

/* price bars */
.bars{border-top:1.5px dashed var(--line);padding:18px 20px 14px;display:grid;gap:12px}
.bars-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.gap{font:600 12px/1 var(--mono);padding:5px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.gap.up{color:var(--sus)}.gap.down{color:var(--buy)}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;gap:12px;align-items:center}
.bar .lb{font-size:13px;line-height:1.3;color:var(--muted);min-width:0}
.bar .lb small{display:block;font:400 11px/1.3 var(--mono);opacity:.85}
.track{height:14px;border-radius:4px;background:var(--paper);position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:4px;transform-origin:left;animation:grow .7s cubic-bezier(.3,.9,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.k-today .fill{background:var(--ink)}
.k-low .fill{background:var(--tag);box-shadow:inset 0 0 0 1px rgba(18,24,38,.18)}
.k-abroad .fill{background:var(--abroad)}
.k-alt .fill{background:var(--alt)}
.k-other .fill{background:var(--other)}
.k-none .track{background:repeating-linear-gradient(-45deg,transparent 0 6px,var(--line) 6px 7px);border:1px dashed var(--line)}
.bar .val{font:600 14px/1.2 var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar .val a{text-decoration:none;border-bottom:1px solid var(--line)}
.bar .val a:hover{border-color:var(--ink)}
.bar .val .nf{color:var(--muted);font-weight:500}
.legend{font:400 11.5px/1.4 var(--mono);color:var(--muted)}
@media (max-width:600px){
  .bar{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .bar .lb{grid-column:1 / -1;grid-row:1}
  .bar .track{grid-column:1;grid-row:2}
  .bar .val{grid-column:2;grid-row:2}
  .card-head{grid-template-columns:minmax(0,1fr)}
  .stamp{text-align:left}
}

/* history over the person's own checks */
.hist{border-top:1.5px dashed var(--line);padding:16px 20px;display:grid;gap:10px}
.hist-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.hist-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:12px 20px;align-items:center}
.hist ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 8px}
.hist li{font:500 12.5px/1.3 var(--mono);font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 8px;white-space:nowrap}
.hist li b{font-weight:700;color:var(--ink)}
.hist li span{color:var(--muted)}
.hist li a{text-decoration:none}
.hist li.last{border-color:var(--ink)}
.spark{width:100%;height:56px;display:block;overflow:visible}
.spark polyline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark circle{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.spark circle.last{fill:var(--tag)}
.hist .note{font-size:13px;color:var(--muted)}
@media (max-width:600px){.hist-body{grid-template-columns:minmax(0,1fr)}}
.update{margin-top:12px;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tag);border-radius:10px;padding:10px 14px;font-size:13.5px}
.update b{font-family:var(--mono);font-weight:600;white-space:nowrap}

/* checks */
.checks{border-top:1.5px dashed var(--line);padding:16px 20px;display:grid;gap:10px;margin:0}
.check{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.check .n{font:700 12px/1 var(--mono);width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;margin-top:1px}
.check dt{font-weight:600;font-size:14px}
.check dd{margin:2px 0 0;color:var(--muted);font-size:14px}

/* sources */
details.src{border-top:1.5px dashed var(--line);padding:12px 20px 16px}
details.src summary{cursor:pointer;font:600 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
details.src ul{margin:10px 0 0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
details.src a{word-break:break-word}

/* end */
.end{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.box h3{font-size:20px;margin-bottom:8px}
.box ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.foot{margin-top:26px;font:400 12px/1.5 var(--mono);color:var(--muted)}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){.fill{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
(function(){
  var UI = {
    en: {
      run: "Checked", decide: "Decide by", budget: "Budget", none: "not set",
      private: "This page is yours. It was made in your own AI chat. Nothing here is sent anywhere or saved.",
      verdict: {BUY: "BUY", WAIT: "WAIT", SKIP: "SKIP", SUSPICIOUS: "SUSPICIOUS"},
      prices: "Prices", vsLow: "vs 30-day low", notFound: "not found", seen: "price on",
      legend: "The longer the bar, the higher the price. Click a price to see where it came from.",
      checks: {need: "Need", price: "Real price", same: "Same product?", alt: "Other options", timing: "Timing"},
      sources: "Sources", total: "Total", before: "Before you pay",
      history: "Price history", sinceLast: "since last check", same: "no change since last check",
      firstCheck: "This is your first check. Come back to this chat tomorrow and write \"check prices again\". The new price will appear next to this one.",
      update: "For fresh prices, write this in the same chat:", updateCmd: "check prices again",
      updateTail: "Earlier checks stay on the page, so you can see how the price changes. Past checks do not appear in a new chat.",
      foot: "Deal Check · Prices change by the hour. Open each link before you pay. AI can be wrong; use this as a second opinion."
    },
    tr: {
      run: "Kontrol edildi", decide: "Son karar günü", budget: "Bütçe", none: "belirtilmedi",
      private: "Bu sayfa sana ait. Kendi yapay zeka sohbetinde hazırlandı. Buradaki hiçbir bilgi başka bir yere gönderilmez veya kaydedilmez.",
      verdict: {BUY: "AL", WAIT: "BEKLE", SKIP: "ATLA", SUSPICIOUS: "ŞÜPHELİ"},
      prices: "Fiyatlar", vsLow: "30 günün en düşüğüne göre", notFound: "bulunamadı", seen: "fiyat tarihi",
      legend: "Çubuk ne kadar uzunsa fiyat o kadar yüksek. Nereden geldiğini görmek için fiyata tıkla.",
      checks: {need: "İhtiyaç", price: "Gerçek fiyat", same: "Aynı ürün mü?", alt: "Diğer seçenekler", timing: "Zamanlama"},
      sources: "Kaynaklar", total: "Toplam", before: "Ödemeden önce",
      history: "Fiyat geçmişi", sinceLast: "son kontrole göre", same: "son kontrolden beri değişmedi",
      firstCheck: "Bu ilk kontrolün. Yarın aynı sohbete dönüp \"fiyatlara tekrar bak\" yaz. Yeni fiyat burada bunun yanında görünür.",
      update: "Güncel fiyatlar için aynı sohbete şunu yaz:", updateCmd: "fiyatlara tekrar bak",
      updateTail: "Eski kontroller sayfada kalır, böylece fiyatın nasıl değiştiğini görürsün. Yeni bir sohbette geçmiş kontroller görünmez.",
      foot: "Deal Check · Fiyatlar saatlik değişir. Ödemeden önce her linki aç. Yapay zeka yanılabilir; bunu ikinci bir görüş olarak kullan."
    }
  };

  var D = {};
  try { D = JSON.parse(document.getElementById('deal-data').textContent); } catch(e) { D = {items: []}; }
  var base = UI[D.lang] || UI.en;
  var T = merge(merge({}, base), D.ui || {});
  var loc = D.locale || (D.lang === 'tr' ? 'tr-TR' : 'en-GB');
  document.documentElement.lang = D.lang || 'en';
  if (D.title) document.title = D.title;

  function merge(a, b){ for (var k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) { a[k] = merge(merge({}, a[k] || {}), b[k]); } else { a[k] = b[k]; } } return a; }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function safeUrl(u){ return typeof u === 'string' && /^https?:\/\//i.test(u) ? u : null; }
  function link(text, url){
    var u = safeUrl(url);
    if (!u) return el('span', null, text);
    var a = el('a', null, text); a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a;
  }
  function day(s){
    if (!s) return '';
    var d = new Date(s + 'T12:00:00');
    if (isNaN(d)) return s;
    try { return d.toLocaleDateString(loc, {day: 'numeric', month: 'short', year: 'numeric'}); } catch(e) { return s; }
  }
  function money(v, cur){
    var frac = Math.round(v) === v ? 0 : 2;
    var o = {style: 'currency', currency: cur || 'EUR', currencyDisplay: 'narrowSymbol', minimumFractionDigits: frac, maximumFractionDigits: frac};
    try { return new Intl.NumberFormat(loc, o).format(v); } catch(e) {}
    try { o.currencyDisplay = 'symbol'; return new Intl.NumberFormat(loc, o).format(v); }
    catch(e) { return v.toFixed(frac) + ' ' + (cur || ''); }
  }
  var vkey = function(v){ v = String(v || '').toUpperCase(); return T.verdict[v] ? v : 'WAIT'; };

  var root = document.getElementById('root');

  // header
  var top = el('header', 'top');
  var left = el('div');
  var brand = el('div', 'brand'); brand.appendChild(el('i')); brand.appendChild(el('span', 'eyebrow', 'Deal Check'));
  left.appendChild(brand);
  var h1 = el('h1', null, D.title || 'Deal Check'); h1.style.marginTop = '10px'; left.appendChild(h1);
  top.appendChild(left);
  var meta = el('div', 'meta');
  function m(k, v){ var s = el('span'); s.appendChild(document.createTextNode(k + ' ')); s.appendChild(el('b', null, v)); meta.appendChild(s); }
  if (D.run_date) m(T.run, day(D.run_date));
  if (D.decide_by) m(T.decide, day(D.decide_by));
  m(T.budget, D.budget || T.none);
  top.appendChild(meta);
  root.appendChild(top);
  root.appendChild(el('p', 'private', T.private));
  var up = el('p', 'update');
  var upt = el('span'); upt.appendChild(document.createTextNode(T.update + ' ')); upt.appendChild(el('b', null, '"' + T.updateCmd + '"')); upt.appendChild(document.createTextNode('. ' + T.updateTail));
  up.appendChild(upt);
  root.appendChild(up);

  // summary
  var items = Array.isArray(D.items) ? D.items : [];
  var sum = el('nav', 'summary');
  items.forEach(function(it, i){
    var a = el('a', 'sum'); a.href = '#item-' + (i + 1);
    var t = el('div'); t.style.minWidth = '0';
    t.appendChild(el('div', 'nm', it.name || ''));
    t.appendChild(el('div', 'ct', it.country || ''));
    a.appendChild(t);
    var k = vkey(it.verdict);
    a.appendChild(el('span', 'pill v-' + k, T.verdict[k]));
    sum.appendChild(a);
  });
  root.appendChild(sum);

  // cards
  items.forEach(function(it, i){
    var k = vkey(it.verdict);
    var card = el('article', 'card'); card.id = 'item-' + (i + 1);
    var head = el('div', 'card-head');
    var hl = el('div');
    hl.appendChild(el('p', 'eyebrow', [it.country, day(D.run_date)].filter(Boolean).join(' · ')));
    hl.appendChild(el('h2', null, it.name || ''));
    if (it.reason) hl.appendChild(el('p', 'reason', '"' + it.reason + '"'));
    if (it.picked) hl.appendChild(el('p', 'picked', it.picked));
    head.appendChild(hl);
    var st = el('div', 'stamp');
    st.appendChild(el('span', 'pill v-' + k, T.verdict[k]));
    if (it.hint) st.appendChild(el('small', null, it.hint));
    head.appendChild(st);
    card.appendChild(head);
    if (it.verdict_reason) card.appendChild(el('p', 'verdict-line', it.verdict_reason));

    // bars
    var prices = Array.isArray(it.prices) ? it.prices : [];
    if (prices.length) {
      var bars = el('div', 'bars');
      var bh = el('div', 'bars-head');
      bh.appendChild(el('span', 'eyebrow', T.prices));
      var today = prices.filter(function(p){ return p.kind === 'today' && typeof p.value === 'number'; })[0];
      var low = prices.filter(function(p){ return p.kind === 'low' && typeof p.value === 'number'; })[0];
      if (today && low && low.value > 0) {
        var pct = Math.round((today.value - low.value) / low.value * 100);
        var g = el('span', 'gap ' + (pct > 0 ? 'up' : 'down'), (pct > 0 ? '+' : '') + pct + '% ' + T.vsLow);
        bh.appendChild(g);
      }
      bars.appendChild(bh);
      var max = 0;
      prices.forEach(function(p){ if (typeof p.value === 'number' && p.value > max) max = p.value; });
      prices.forEach(function(p){
        var has = typeof p.value === 'number';
        var row = el('div', 'bar k-' + (has ? (p.kind || 'other') : 'none'));
        var lb = el('div', 'lb', p.label || '');
        if (has && p.date) lb.appendChild(el('small', null, T.seen + ' ' + day(p.date)));
        row.appendChild(lb);
        var tr = el('div', 'track');
        if (has && max > 0) { var f = el('div', 'fill'); f.style.width = Math.max(2, p.value / max * 100) + '%'; tr.appendChild(f); }
        row.appendChild(tr);
        var val = el('div', 'val');
        if (has) val.appendChild(link((p.prefix || '') + money(p.value, it.currency), p.url));
        else val.appendChild(el('span', 'nf', T.notFound));
        row.appendChild(val);
        bars.appendChild(row);
      });
      bars.appendChild(el('p', 'legend', T.legend));
      card.appendChild(bars);
    }

    // history: the "today" price at each of the person's checks
    var hist = (Array.isArray(it.history) ? it.history : [])
      .filter(function(h){ return h && typeof h.date === 'string' && h.date; })
      .sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })
      .filter(function(h, idx, arr){ var keep = !arr[idx + 1] || arr[idx + 1].date !== h.date; return keep; });
    if (hist.length) {
      var hs = el('div', 'hist');
      var hh = el('div', 'hist-head');
      hh.appendChild(el('span', 'eyebrow', T.history + ' (' + hist.length + ')'));
      var nums = hist.filter(function(h){ return typeof h.value === 'number'; });
      if (nums.length >= 2) {
        var a1 = nums[nums.length - 2].value, a2 = nums[nums.length - 1].value;
        if (a1 > 0) {
          var dp = Math.round((a2 - a1) / a1 * 100);
          var txt = a2 === a1 ? T.same : (dp > 0 ? '+' : (dp === 0 ? '±' : '')) + dp + '% ' + T.sinceLast;
          hh.appendChild(el('span', 'gap ' + (a2 > a1 ? 'up' : 'down'), txt));
        }
      }
      hs.appendChild(hh);
      var body = el('div', 'hist-body');
      var ol = el('ol');
      hist.forEach(function(h, idx){
        var li = el('li', idx === hist.length - 1 ? 'last' : null);
        li.appendChild(el('span', null, day(h.date) + ' '));
        var v = typeof h.value === 'number' ? money(h.value, it.currency) : T.notFound;
        var b = el('b'); b.appendChild(typeof h.value === 'number' ? link(v, h.url) : document.createTextNode(v));
        li.appendChild(b);
        ol.appendChild(li);
      });
      body.appendChild(ol);
      if (nums.length >= 2) {
        var NS = 'http://www.w3.org/2000/svg', W = 260, H = 56, P = 7;
        var lo = Math.min.apply(null, nums.map(function(h){ return h.value; }));
        var hi = Math.max.apply(null, nums.map(function(h){ return h.value; }));
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'spark'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', T.history);
        var pts = nums.map(function(h, idx){
          var x = P + (W - 2 * P) * (idx / (nums.length - 1));
          var y = hi === lo ? H / 2 : P + (H - 2 * P) * (1 - (h.value - lo) / (hi - lo));
          return [x, y];
        });
        var pl = document.createElementNS(NS, 'polyline');
        pl.setAttribute('points', pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '));
        svg.appendChild(pl);
        pts.forEach(function(p, idx){
          var cc = document.createElementNS(NS, 'circle');
          cc.setAttribute('cx', p[0].toFixed(1)); cc.setAttribute('cy', p[1].toFixed(1)); cc.setAttribute('r', '4');
          if (idx === pts.length - 1) cc.setAttribute('class', 'last');
          svg.appendChild(cc);
        });
        body.appendChild(svg);
      }
      hs.appendChild(body);
      if (hist.length === 1) hs.appendChild(el('p', 'note', T.firstCheck));
      card.appendChild(hs);
    }

    // five checks
    var c = it.checks || {};
    var dl = el('dl', 'checks');
    ['need', 'price', 'same', 'alt', 'timing'].forEach(function(key, n){
      if (!c[key]) return;
      var row = el('div', 'check');
      row.appendChild(el('span', 'n', String(n + 1)));
      var body = el('div');
      body.appendChild(el('dt', null, T.checks[key]));
      body.appendChild(el('dd', null, c[key]));
      row.appendChild(body);
      dl.appendChild(row);
    });
    card.appendChild(dl);

    // sources
    var src = Array.isArray(it.sources) ? it.sources.filter(function(s){ return safeUrl(s.url); }) : [];
    if (src.length) {
      var det = el('details', 'src');
      det.appendChild(el('summary', null, T.sources + ' (' + src.length + ')'));
      var ul = el('ul');
      src.forEach(function(s){ var li = el('li'); li.appendChild(link(s.label || s.url, s.url)); ul.appendChild(li); });
      det.appendChild(ul);
      card.appendChild(det);
    }
    root.appendChild(card);
  });

  // total + before you pay
  var end = el('div', 'end');
  if (D.total) { var b1 = el('section', 'box'); b1.appendChild(el('h3', null, T.total)); b1.appendChild(el('p', null, D.total)); end.appendChild(b1); }
  var byp = Array.isArray(D.before_you_pay) ? D.before_you_pay.slice(0, 3) : [];
  if (byp.length) { var b2 = el('section', 'box'); b2.appendChild(el('h3', null, T.before)); var ol = el('ol'); byp.forEach(function(s){ ol.appendChild(el('li', null, s)); }); b2.appendChild(ol); end.appendChild(b2); }
  if (end.children.length) root.appendChild(end);
  root.appendChild(el('p', 'foot', T.foot));
})();
</script>
</body>
</html>
